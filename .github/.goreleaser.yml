version: 2

project_name: ridlfmt

builds:
  - id: ridlfmt
    main: .
    binary: ridlfmt
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version=v{{.Version}}

archives:
  - formats: [binary]
    name_template: "{{ .Binary }}.{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  use: github-native
